@if (itemsState(); as state) {
  @if (state.loading) {
    LOADING
  } @else if (state.error) {
    {{state.error}}
  } @else if (state.data; as data) {
    <items-grid [items]="data.items | toGridItem" [itemTemplate]="assetPreview">
      <ng-template #assetPreview let-item>
        <item-preview [item]="item" />
      </ng-template>  
    </items-grid>

    <paginator
      [model]="{
        currentPage: page(),
        maxPreviousPageButtons: 4,
        maxButtonsDisplayed: 10,
        totalPages: data.pagesCount
      }"
    />
  }
}
