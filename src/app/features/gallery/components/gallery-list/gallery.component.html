@let query = itemsQuery;

@if (query.isLoading()) {
  LOADING
} @else if (query.isError()) {
  <error-message 
    [error]="query.error()"
  />
} @else if (query.data(); as data) {
  <navigation-bar></navigation-bar>
  <items-grid [items]="data.items | toGridItem" [itemTemplate]="assetPreview">
    <ng-template #assetPreview let-item>
      <item-preview [item]="item" />
    </ng-template>  
  </items-grid>

  <paginator
    [model]="{
      currentPage: page(),
      maxButtonsDisplayed: maxButtonsDisplayed(),
      maxPreviousPageButtons: maxPreviousPageButtons(),
      totalPages: data.pagesCount
    }"
  />
}
