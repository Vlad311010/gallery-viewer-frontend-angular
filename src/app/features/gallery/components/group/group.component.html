@let state = itemsQuery;

@if (state.isLoading()) {
  LOADING
} @else if (state.isError()) {
  <error-message 
    [error]="state.error()"
  />
} @else if (state.data(); as data) {
  <items-grid [items]="data.items" [itemTemplate]="assetPreview">
    <ng-template #assetPreview let-item>
      <item-preview-group 
        [item]="item"
        (coverFlagChange)="onCoverFlagChange(item.id, $event)";
      />
    </ng-template>  
  </items-grid>

  <paginator
    [model]="{
      currentPage: page(),
      maxButtonsDisplayed: maxButtonsDisplayed(),
      maxPreviousPageButtons: maxPreviousPageButtons(),
      totalPages: data.pagesCount
    }"
  />
}
