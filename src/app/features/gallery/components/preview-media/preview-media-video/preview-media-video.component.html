@if (previewLoadingError()) {
  <img [src]="previewUrl()" [class]="classStyle()">
}
@else {
  <video
    [src]="previewUrl()"
    class="video"
    [class]="classStyle()"
    [controls]="false"
    [muted]="true"
    playsInline
    disablePictureInPicture
    disableRemotePlayback
    preload="auto"
    loading="eager"
    [autoplay]="false"
    [loop]="true"
    (canplaythrough)="onPreviewLoad()"
    (error)="onPreviewError($event)"
    (mouseenter)="onMouseEnter($event)"
    (mouseleave)="onMouseLeave($event)"
  ></video>

  @if (showEditLabel() && !isGroup()) {
  <span class="edit-mode-label">
    Edit
  </span>
  }
}
