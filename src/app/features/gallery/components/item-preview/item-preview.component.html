

<figure className="gallery-item-image">
  <item-link 
    class="gallery-item-preview"
    [style.display]="isLoadingPreview ? 'none' : 'block'"
    [itemId]="item().id" 
    [isGroup]="item().type | isGroup" 
  >
    <preview-media 
      [itemId]="item().id" 
      [showEditLable]="true"
      [isGroup]="item().type | isGroup"
      [src]="src()"
      [isVideo]="!assetMetaData() ? false : assetMetaData() | isVideo"
      (loadingChange)="onPreviewLoadingChange($event)"
    />  
  </item-link>

  @if (isLoadingPreview) {
    <loader [size]="36" color="white" />
  }
</figure>
