
<figure className="gallery-item-image">
  <item-link class="gallery-item-preview"
    [itemId]="item().id" 
    [isGroup]="item().type | isGroup" 
  >
    <preview-media 
      [itemId]="item().id" 
      [showEditLable]="true"
      [isGroup]="item().type | isGroup"
      [isVideo]="false"
    />
  </item-link>
</figure>
