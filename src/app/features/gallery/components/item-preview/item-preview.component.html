@let query = assetMetadataQuery;
@let editModeOn = this.viewState.getState().editModeOn;
@let isLoading = isLoadingPreview() || query.isLoading();

<figure class="gallery-item-image">
  <item-link
    class="gallery-item-preview"
    [style.pointerEvents]="isLoading ? 'none' : 'auto'"
    [itemId]="item().id"
    [isGroup]="item().type | isGroup"
    [editModeOn]="editModeOn"
  >
    <loader [size]="36" color="white" [boundWidth]="150" [boundHeight]="300" [showLoader]="isLoading">
      @if (query.data() | isVideo) {
        <preview-media-video
          [itemId]="item().id"
          [showEditLabel]="editModeOn"
          [isGroup]="item().type | isGroup"
          [src]="src()"
          (loadingChange)="onPreviewLoadingChange($event)"
        />
      } @else {
        <preview-media-image
          [itemId]="item().id"
          [showEditLabel]="editModeOn"
          [isGroup]="item().type | isGroup"
          [src]="src()"
          (loadingChange)="onPreviewLoadingChange($event)"
        />
      }
    </loader>
  </item-link>
</figure>
