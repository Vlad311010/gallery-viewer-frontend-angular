@let editModeOn = viewStateService.getState().editModeOn;

<item-preview [item]="{id:id(), type: type()}"></item-preview>

@if (editModeOn) {
  <div class="editing-elements">
    <input
      type="number"
      aria-label="Position"
      (change)="onPositionValueChange($event)"
    />

    <label>
      <input readOnly
        type="checkbox"
        [disabled]="isCoverAsset()"
        [checked]="isCoverAsset()"
        (click)="onCoverFlagChange($event)"
      />
      Cover
    </label>
    
  </div>

  <div class="position-display">
      Normalized position: {{position()}}
  </div>

  @if (isAssetAddRemoveAllowed()) {
    <div class="button-container">
      <button class="button button-control button-fit">REMOVE</button>
    </div>
  }
}
