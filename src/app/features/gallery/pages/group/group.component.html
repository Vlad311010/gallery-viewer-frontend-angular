@let state = itemsQuery;
@let editModeOn = viewState.getState().editModeOn;

<section class="controlls-bar">
  <span class="controlls-bar-controll-elements">
    <a [href]="returnUrl()" class="button button-subtle button-fit" [class.disabled]="!returnUrl()">↩ Back</a>
    
    <h2 class="controlls-bar-title">{{groupDetailsQuery.data()?.title}}</h2>
  </span>
  
  
  <span class="controlls-bar-controll-elements" [style.visibility]="editModeOn ? 'visible' : 'hidden'">
    <button class="button button-subtle button-sm" >
      SUBMIT POSITION EDITS
    </button>
  </span>
</section>


@if (state.isLoading()) {
  LOADING
} @else if (state.isError()) {
  <error-message 
    [error]="state.error()"
  />
} @else if (displayItems(); as data) {
  <items-grid 
    [items]="data.items" 
    [itemTemplate]="assetPreview" 
    refShortcut elementFilter="item-preview"
  >
    <ng-template #assetPreview let-item>
      <item-preview-group 
        [id]="item.id"
        [type]="item.type"
        [position]="positions.find(x => x.id == item.id)?.position ?? 0"
        [normalizedPosition]="normalizedPositions.find(x => x.id == item.id)?.position ?? 0"
        [isAssetAddRemoveAllowed]="item.isAssetAddRemoveAllowed"
        [isCoverAsset]="item.isCoverAsset"
        (coverFlagChange)="onCoverFlagChange(item.id, $event)";
        (positionChange)="onPositionValueChange(item.id, $event)";
      />
    </ng-template>  
  </items-grid>

  <paginator
    [model]="{
      currentPage: page(),
      maxButtonsDisplayed: maxButtonsDisplayed(),
      maxPreviousPageButtons: maxPreviousPageButtons(),
      totalPages: data.pagesCount
    }"
  />
}
